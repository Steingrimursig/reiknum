<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kennarasíða — Stærðfræði</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --indigo: #4f46e5;
  --indigo-light: #6366f1;
  --indigo-pale: #e0e7ff;
  --teal: #0d9488;
  --teal-light: #ccfbf1;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --rose: #e11d48;
  --rose-light: #ffe4e6;
  --green: #16a34a;
  --green-light: #dcfce7;
  --slate: #1e293b;
  --slate-mid: #475569;
  --slate-light: #94a3b8;
  --bg: #f1f5f9;
  --white: #ffffff;
  --radius: 18px;
  --shadow: 0 8px 32px rgba(79,70,229,0.10);
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--slate);
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, var(--indigo), var(--indigo-light));
  color: white;
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 { font-size: 22px; font-weight: 900; }
.header p { font-size: 14px; opacity: 0.75; margin-top: 2px; }

.refresh-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
}
.refresh-btn:hover { background: rgba(255,255,255,0.33); }

.container { padding: 28px 32px; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.summary-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.summary-card .label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--slate-light);
  margin-bottom: 8px;
}

.summary-card .value {
  font-size: 32px;
  font-weight: 900;
  color: var(--slate);
}

.summary-card .value.green { color: var(--green); }
.summary-card .value.rose { color: var(--rose); }
.summary-card .value.indigo { color: var(--indigo); }

.section-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--slate);
  margin-bottom: 16px;
}

.empty-state {
  background: white;
  border-radius: 16px;
  padding: 48px;
  text-align: center;
  box-shadow: var(--shadow);
  color: var(--slate-light);
  font-size: 16px;
}

.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

.student-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}

.student-card {
  background: white;
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.student-card-header {
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #f1f5f9;
}

.student-name-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--indigo-pale);
  color: var(--indigo);
  font-size: 16px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.student-card-header h3 { font-size: 16px; font-weight: 800; }

.level-pill {
  font-size: 11px;
  font-weight: 800;
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--teal-light);
  color: var(--teal);
}

.student-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 16px 20px;
  gap: 8px;
}

.stat { text-align: center; }
.stat .stat-val { font-size: 22px; font-weight: 900; }
.stat .stat-val.green { color: var(--green); }
.stat .stat-val.rose { color: var(--rose); }
.stat .stat-label { font-size: 11px; color: var(--slate-light); font-weight: 700; margin-top: 2px; }

.mini-bar {
  height: 6px;
  background: var(--bg);
  margin: 0 20px 16px;
  border-radius: 99px;
  overflow: hidden;
}

.mini-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--green), #22c55e);
}

.activity-row {
  padding: 0 20px 16px;
}

.activity-label { font-size: 12px; font-weight: 700; color: var(--slate-light); margin-bottom: 6px; }

.activity-dots {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg);
}

.dot.correct { background: var(--green); }
.dot.incorrect { background: var(--rose); }
.dot.advance { background: var(--indigo); }

.delete-btn {
  background: none;
  border: none;
  color: var(--slate-light);
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
  border-radius: 8px;
  transition: all 0.15s;
}
.delete-btn:hover { color: var(--rose); background: var(--rose-light); }

.kn-tab { padding: 10px 18px; font-size: 14px; font-weight: 700; font-family: Nunito,sans-serif; border: none; background: none; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; border-radius: 8px 8px 0 0; }
.kn-tab.active { color: #2b6a6a; border-bottom-color: #2b6a6a; background: #e3efef; }
.pepper-card { border-radius: 12px; padding: 18px; border: 2px solid; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Kennarasíða</h1>
    <p>Yfirlit yfir framgang nemenda</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <input id="bekkurInput" placeholder="Bekkjarkóði (t.d. 6ss)" autocomplete="off"
      style="padding:9px 16px;border-radius:10px;border:2px solid rgba(255,255,255,0.3);
      background:rgba(255,255,255,0.15);color:white;font-size:15px;font-weight:700;
      font-family:Nunito,sans-serif;width:220px;outline:none;"
      onfocus="this.style.background='rgba(255,255,255,0.25)'"
      onblur="this.style.background='rgba(255,255,255,0.15)'">
    <button id="loadBtn" class="refresh-btn" style="white-space:nowrap;" onclick="window.loadData && window.loadData()">🔍 Sækja nemendur</button>
  </div>
</div>

<div class="container">

  <!-- Flipar -->
  <div style="display:flex;gap:4px;border-bottom:2px solid #e2e8f0;margin-bottom:24px;">
    <button class="kn-tab active" onclick="showKnTab('nemendur',this)">👥 Nemendur</button>
    <button class="kn-tab" onclick="showKnTab('pipar',this)">🌶️ Pipardæmi</button>

  <!-- Nemendaflipi -->
  <div id="knTab-nemendur">
    <div class="summary-grid" id="summaryGrid"></div>
    <div id="topicArea"></div>
    <div class="section-title">Nemendur</div>
    <div id="studentArea"></div>
  </div>

  <!-- Pipardæmaflipi -->
  <div id="knTab-pipar" style="display:none;">
    <div style="background:white;border-radius:12px;padding:24px;box-shadow:var(--shadow);">

      <div style="font-size:14px;color:var(--slate-light);margin-bottom:20px;">Veldu hugtak og bekk. Þrjú dæmi með mismunandi erfiðleika birtast á skjáum allra nemenda í bekknum, sem frjósa á meðan.</div>

      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;">
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--slate-mid);display:block;margin-bottom:4px;">Hugtak</label>
          <select id="piparTopic" style="padding:9px 14px;border-radius:10px;border:2px solid #e2e8f0;font-size:14px;font-family:Nunito,sans-serif;font-weight:700;min-width:200px;">
          </select>
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--slate-mid);display:block;margin-bottom:4px;">Bekkur</label>
          <input id="piparBekkur" placeholder="t.d. 6ss" style="padding:9px 14px;border-radius:10px;border:2px solid #e2e8f0;font-size:14px;font-family:Nunito,sans-serif;font-weight:700;width:120px;">
        </div>
        <button onclick="sendPipar()" style="background:#c2475a;color:white;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:800;font-family:Nunito,sans-serif;cursor:pointer;">🌶️ Senda á bekkinn</button>
        <button onclick="stopPipar()" style="background:#e2e8f0;color:var(--slate);border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:800;font-family:Nunito,sans-serif;cursor:pointer;">⏹ Affrysta</button>
      </div>

      <div id="piparPreview" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;"></div>
      <div id="piparStatus" style="margin-top:16px;font-size:14px;font-weight:700;color:var(--slate-light);"></div>
    </div>
  </div>

</div>

<script type="module">

import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"

// Skilgreina flipa-skiptingu STRAX (óháð Firebase)
window.showKnTab = function(id, btn) {
  document.querySelectorAll('.kn-tab').forEach(t => t.classList.remove('active'))
  if (btn) btn.classList.add('active')
  const nem = document.getElementById('knTab-nemendur')
  const pip = document.getElementById('knTab-pipar')
  if (nem) nem.style.display = id === 'nemendur' ? 'block' : 'none'
  if (pip) pip.style.display = id === 'pipar' ? 'block' : 'none'
  if (id === 'pipar' && window.fillPiparTopics) window.fillPiparTopics()
}

  appId: "1:277838494408:web:ffec8f0995c72103a843fd"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)

function getSetName(setIndex) {
  const mountains = [
    { name: 'Esja', icon: '🏔️' },
    { name: 'Akrafjall', icon: '⛰️' },
    { name: 'Tindastóll', icon: '🗻' },
    { name: 'Askja', icon: '🌋' },
    { name: 'Katla', icon: '🌋' }
  ]
  const mt = mountains[setIndex]
  return mt ? mt.icon + ' ' + mt.name : 'Stig ' + (setIndex + 1)
}

function calcStats(data) {
  const arr = Array.isArray(data) ? data : Object.values(data || {})
  const correct = arr.filter(d => d.status === 'correct').length
  const incorrect = arr.filter(d => d.status === 'incorrect').length
  const advances = arr.filter(d => d.status === 'advance').length
  const total = correct + incorrect
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0
  return { correct, incorrect, advances, total, pct }
}

function calcTopics(students) {
  const topicMap = {}
  students.forEach(st => {
    const arr = Array.isArray(st.data) ? st.data : Object.values(st.data || {})
    arr.forEach(d => {
      if (!d.topic) return
      if (!topicMap[d.topic]) topicMap[d.topic] = { correct: 0, incorrect: 0 }
      if (d.status === 'correct') topicMap[d.topic].correct++
      if (d.status === 'incorrect') topicMap[d.topic].incorrect++
    })
  })
  return Object.entries(topicMap)
    .map(([key, val]) => {
      const total = val.correct + val.incorrect
      const pct = total > 0 ? Math.round((val.correct / total) * 100) : 0
      return { key, ...val, total, pct }
    })
    .filter(t => t.total >= 2)
    .sort((a, b) => a.pct - b.pct)
}

window.deleteStudent = async function(bekkur, nafn) {
  if (!confirm('Eyða öllum gögnum fyrir ' + nafn + '?')) return
  const r = ref(db, 'bekkir/' + bekkur + '/nemendur/' + nafn)
  await remove(r)
  loadData()
}

async function loadData() {
  const bekkur = document.getElementById('bekkurInput').value.trim()
    .toLowerCase().replace(/[.#$\[\]/\s]/g, '_')
  if (!bekkur) {
    document.getElementById('studentArea').innerHTML =
      '<div style="color:#94a3b8;padding:20px;">Sláðu inn bekkjarkóðann til að sjá nemendur.</div>'
    return
  }

  document.getElementById('studentArea').innerHTML =
    '<div style="color:#94a3b8;padding:20px;">⏳ Hleð gögnum...</div>'

  let snap
  try {
    snap = await get(ref(db, 'bekkir/' + bekkur + '/nemendur'))
  } catch(err) {
    var rulesText = '{\n  "rules": {\n    "bekkir": {\n      "$bekkur": {\n        ".read": true,\n        "nemendur": {\n          "$nemandi": {\n            ".write": true\n          }\n        }\n      }\n    }\n  }\n}'
    document.getElementById('studentArea').innerHTML =
      '<div style="background:#fff1f2;border-radius:12px;padding:16px 20px;color:#e11d48;font-weight:700;">'
      + '⚠️ Heimild vantar. Farðu á Firebase → Realtime Database → Rules og settu inn:'
      + '<pre style="background:#1e293b;color:#a5f3fc;border-radius:8px;padding:12px;margin-top:10px;font-size:12px;overflow:auto;">'
      + rulesText
      + '</pre></div>'
    return
  }
  if (!snap.exists()) {
    document.getElementById('studentArea').innerHTML =
      '<div style="color:#94a3b8;padding:20px;">Engir nemendur fundust í bekk <strong>' + bekkur + '</strong>. Athugaðu bekkjarkóðann.</div>'
    document.getElementById('summaryGrid').innerHTML = ''
    document.getElementById('topicArea').innerHTML = ''
    return
  }

  const nemendur = snap.val()
  const students = Object.entries(nemendur).map(([nafn, val]) => ({
    name: val.state?.name || nafn,
    nafn,
    bekkur,
    data: Array.isArray(val.progress) ? val.progress : Object.values(val.progress || {}),
    savedState: val.state || null
  }))

  // Summary
  const totalCorrect = students.reduce((s, st) => s + calcStats(st.data).correct, 0)
  const totalAnswers = students.reduce((s, st) => s + calcStats(st.data).total, 0)
  const avgPct = totalAnswers > 0 ? Math.round((totalCorrect / totalAnswers) * 100) : 0

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="label">Nemendur</div>
      <div class="value indigo">${students.length}</div>
    </div>
    <div class="summary-card">
      <div class="label">Rétt svör alls</div>
      <div class="value green">${totalCorrect}</div>
    </div>
    <div class="summary-card">
      <div class="label">Meðalhlutfall</div>
      <div class="value amber">${avgPct}%</div>
    </div>`

  // Topics
  const topics = calcTopics(students)
  if (topics.length > 0) {
    document.getElementById('topicArea').innerHTML = `
      <div class="section-title" style="margin-top:24px;">Hugtakayfirlit bekkjarins</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;">
        ${topics.map(t => {
          const col = t.pct < 50 ? '#e11d48' : t.pct < 75 ? '#f59e0b' : '#16a34a'
          const bg = t.pct < 50 ? '#fff1f2' : t.pct < 75 ? '#fffbeb' : '#f0fdf4'
          return `<div style="padding:8px 14px;border-radius:10px;background:${bg};border:1.5px solid ${col}22;">
            <span style="font-size:13px;font-weight:700;color:${col};">${t.key}</span>
            <span style="font-size:12px;color:#64748b;margin-left:8px;">${t.pct}%</span>
          </div>`
        }).join('')}
      </div>`
  }

  // Student cards
  const areaEl = document.getElementById('studentArea')
  areaEl.innerHTML = ''
  students.sort((a, b) => a.name.localeCompare(b.name)).forEach(st => {
    const s = calcStats(st.data)
    const currentStars = st.savedState?.correct || 0
    const setIndex = st.savedState?.set || 0
    const setName = getSetName(setIndex)
    const initials = st.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2)
    const dots = st.data.slice(-20).map(d => {
      const col = d.status === 'correct' ? '#16a34a' : d.status === 'advance' ? '#4f46e5' : '#e11d48'
      return `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${col};margin:1px;"></span>`
    }).join('')
    const starsHtml = Array.from({length:15}, (_,i) =>
      `<span style="font-size:12px;${i < currentStars ? '' : 'filter:grayscale(1) opacity(0.3)'}">⭐</span>`
    ).join('')
    const lastSeen = st.savedState?.timestamp
      ? new Date(st.savedState.timestamp).toLocaleDateString('is-IS') : '—'

    const card = document.createElement('div')
    card.className = 'student-card'
    card.innerHTML = `
      <div class="student-card-header">
        <div class="student-name-row">
          <div class="avatar">${initials}</div>
          <div>
            <h3>${st.name}</h3>
            <div style="font-size:12px;color:var(--slate-light);margin-top:2px;">Síðast virkur: ${lastSeen}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="level-pill">${setName}</div>
          <button class="delete-btn" onclick="deleteStudent('${st.bekkur}','${st.nafn}')" title="Eyða gögnum">🗑</button>
        </div>
      </div>
      <div style="padding:10px 20px 4px;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:12px;font-weight:700;color:var(--slate-light);">Stjörnur að næsta stigi</span>
        <span style="font-size:12px;font-weight:800;color:var(--indigo);">${currentStars} / 15</span>
      </div>
      <div style="padding:4px 20px 10px;line-height:1.6;">${starsHtml}</div>
      <div class="student-stats">
        <div class="stat"><div class="stat-val green">${s.correct}</div><div class="stat-label">Rétt</div></div>
        <div class="stat"><div class="stat-val rose">${s.incorrect}</div><div class="stat-label">Rangt</div></div>
        <div class="stat"><div class="stat-val">${s.pct}%</div><div class="stat-label">Hlutfall</div></div>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${s.pct}%"></div></div>
      <div class="activity-row">
        <div class="activity-label">Síðustu 20 svör</div>
        <div class="activity-dots">${dots}</div>
      </div>`
    areaEl.appendChild(card)
  })
}

window.fillPiparTopics = function fillPiparTopics() {
  const sel = document.getElementById('piparTopic')
  if (!sel) return
  sel.innerHTML = ''
  Object.keys(PIPAR_BANK).forEach(key => {
    const opt = document.createElement('option')
    opt.value = key
    opt.textContent = PIPAR_BANK[key].label
    sel.appendChild(opt)
  })
  sel.addEventListener('change', renderPiparPreview)
  renderPiparPreview()
}

function renderPiparPreview() {
  const key = document.getElementById('piparTopic').value
  const data = PIPAR_BANK[key]
  if (!data) return
  const peppers = [
    { id: 'chili', icon: '🌶️', name: 'Grænn chili', level: 'Auðvelt', color: '#2f8f57', bg: '#ddf0e3', border: '#86d3a3' },
    { id: 'habanero', icon: '🌶️', name: 'Habanero', level: 'Miðlungs', color: '#d98a26', bg: '#fbeed5', border: '#e8b765' },
    { id: 'reaper', icon: '🔥', name: 'Carolina Reaper', level: 'Erfitt', color: '#c2475a', bg: '#f8e0e4', border: '#e89aa6' }
  ]
  const prev = document.getElementById('piparPreview')
  prev.innerHTML = peppers.map(p => {
    const prob = data[p.id]
    return '<div class="pepper-card" style="background:' + p.bg + ';border-color:' + p.border + ';">'
      + '<div style="font-size:24px;margin-bottom:6px;">' + p.icon + '</div>'
      + '<div style="font-size:13px;font-weight:800;color:' + p.color + ';">' + p.name + '</div>'
      + '<div style="font-size:11px;font-weight:700;color:' + p.color + ';opacity:0.7;margin-bottom:10px;">' + p.level + '</div>'
      + '<div style="font-size:16px;font-weight:800;color:#22303b;margin-bottom:8px;">' + prob.q + '</div>'
      + '<div style="font-size:12px;color:var(--slate-light);">Svar: ' + prob.a + '</div>'
      + '</div>'
  }).join('')
}

window.sendPipar = async function() {
  const key = document.getElementById('piparTopic').value
  const bekkur = document.getElementById('piparBekkur').value.trim().toLowerCase().replace(/[.#$\[\]/\s]/g, '_')
  const data = PIPAR_BANK[key]
  if (!bekkur) { document.getElementById('piparStatus').textContent = '⚠️ Sláðu inn bekk fyrst'; return }
  if (!data) return

  const payload = {
    active: true,
    topic: data.label,
    chili: data.chili,
    habanero: data.habanero,
    reaper: data.reaper,
    timestamp: Date.now()
  }
  try {
    await set(ref(db, 'bekkir/' + bekkur + '/pipar'), payload)
    document.getElementById('piparStatus').innerHTML = '<span style="color:#c2475a;">🌶️ Pipardæmi send á bekk <strong>' + bekkur + '</strong> — skjáir nemenda frosnir!</span>'
  } catch(e) {
    document.getElementById('piparStatus').textContent = '⚠️ Villa: ' + e.message
  }
}

window.stopPipar = async function() {
  const bekkur = document.getElementById('piparBekkur').value.trim().toLowerCase().replace(/[.#$\[\]/\s]/g, '_')
  if (!bekkur) { document.getElementById('piparStatus').textContent = '⚠️ Sláðu inn bekk fyrst'; return }
  try {
    await set(ref(db, 'bekkir/' + bekkur + '/pipar'), { active: false, timestamp: Date.now() })
    document.getElementById('piparStatus').innerHTML = '<span style="color:#2f8f57;">✓ Skjáir nemenda affrystir í bekk <strong>' + bekkur + '</strong></span>'
  } catch(e) {
    document.getElementById('piparStatus').textContent = '⚠️ Villa: ' + e.message
  }
}




// Module scripts eru deferred — DOM er tilbúið hér
function initKennari() {
  const btn = document.getElementById('loadBtn')
  const inp = document.getElementById('bekkurInput')
  if (btn) btn.addEventListener('click', loadData)
  if (inp) inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') loadData()
  })
  const area = document.getElementById('studentArea')
  if (area) area.innerHTML =
    '<div style="color:#94a3b8;padding:20px;text-align:center;">Sláðu inn bekkjarkóðann og smelltu 🔍</div>'
}

// Gera loadData aðgengilegt frá hnappi (öryggisventill)
window.loadData = loadData

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initKennari)
} else {
  initKennari()
}
</script>
